name: CI

# Build, vet, test and scan on every push and pull request. The image job builds
# the container and starts it, because building is not the same as running.
#
# The weekly schedule repeats all of it against a clean machine, which is what
# catches a dependency or a runner image that has drifted since the last push
# rather than at the moment someone opens a pull request.

on:
  # main only: a pull request already covers its own branch, and running both
  # events doubles the work and the wait for every push to one.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

permissions:
  contents: read

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The integration tests are not mocks: they run ffmpeg and ffprobe and
      # assert the segments that come out, so the runner needs them installed.
      # tesseract is optional to the server but not to the OCR test: without it
      # that test skips, so installing it is what makes CI cover the path.
      #
      # Only what is missing is installed, and the download is retried: apt on a
      # shared runner has taken seventeen minutes for one package, and paying
      # that when the tool is already on the image is pure waste.
      - name: Install ffmpeg and tesseract
        run: |
          missing=()
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          command -v tesseract >/dev/null || missing+=(tesseract-ocr)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ffmpeg and tesseract are already on the runner"
            exit 0
          fi
          echo "installing: ${missing[*]}"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 "${missing[@]}"

      # Formatting is a test here because this project has no other gate on it.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Separate from the run above so a failure says which layer it is in.
      - name: Test with integration
        run: go test -tags=integration -race -count=1 ./...

      # The front end has no build step, so a parse check is the whole of what
      # can be verified about it without a browser.
      - name: Parse the web UI
        run: |
          node --check web/app.js
          node --check web/core.js

      # The pure timeline core is unit-tested with Node's own runner, so this
      # needs no npm install and no lockfile.
      #
      # The files are named rather than the directory: whether `--test` accepts a
      # directory depends on the Node version, and the runner's is not this
      # machine's. Naming them works on every version that has `--test` at all.
      - name: Test the web core
        run: node --test web/*.test.js

      # deploy/README.md's systemd runbook is followed from an extracted release
      # archive: it copies the documents into /usr/local/share/doc and installs
      # the unit out of deploy/. That makes the archive's layout part of the
      # release contract, and a tag is a late place to discover it broke. Build
      # one for the runner's own platform and check it here instead.
      - name: Check the release layout
        run: |
          scripts/build-release.sh 0.0.0-layout-check linux/amd64
          archive=dist/astraeus-server_0.0.0-layout-check_linux_amd64.tar.gz
          # Directory entries carry a trailing slash and a leading top-level
          # component; normalise both away so the names match the runbook's.
          layout="$(mktemp)"
          tar tzf "$archive" | sed 's|^[^/]*/||; s|/$||' | sort -u > "$layout"
          status=0
          # Everything the runbook installs has to be there.
          for f in astraeus-server web README.md SPECIFICATION.md TODO.md \
                   CONTEXT.md CONTRIBUTING.md SECURITY.md LICENSE \
                   THIRD_PARTY_NOTICES.md deploy deploy/astraeus.service \
                   docs/index.md docs/playback.md docs/configuration.md \
                   docs/api.md docs/development.md; do
            grep -qx "$f" "$layout" || { echo "missing from the release archive: $f"; status=1; }
          done
          # And the project's working documents must not be, or a release starts
          # shipping an internal audit to people who only wanted a media server.
          for f in docs/handoff.md docs/adversarial-review.md docs/review; do
            if grep -qx "$f" "$layout"; then
              echo "must not be in the release archive: $f"
              status=1
            fi
          done
          exit "$status"

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scanner diffs a branch against its base, so it needs the history
          # rather than the default single commit.
          fetch-depth: 0

      # Pinned to a commit, not a tag: this job reads the whole repository, and
      # a tag can be moved under it. Dependabot keeps the pin current.
      # `--results=verified,unknown` reports credentials it could prove are live
      # and ones it could not check, which is the honest pair; `unverified` is
      # left out because it is mostly entropy false positives.
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # The action passes --no-update itself, and repeating a flag is an error.
          extra_args: --results=verified,unknown

  image:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t astraeus-media:ci .

      # Building is not the same as starting. This catches the class of mistake
      # that an image build cannot: a missing entrypoint, a bad default flag, a
      # volume the process cannot write to.
      - name: Start it and wait for health
        run: |
          docker run -d --name astraeus-ci -p 127.0.0.1:8642:8642 astraeus-media:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8642/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "the server never answered /api/health; logs follow"
          docker logs astraeus-ci
          exit 1

      - name: Show the startup log
        if: always()
        run: docker logs astraeus-ci || true
